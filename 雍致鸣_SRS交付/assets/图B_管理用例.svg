<text x="805.0" y="296.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">管理课程、作业与原始说明</text>
<ellipse cx="805.0" cy="399.0" rx="265.0" ry="41.0" fill="#eaf2fb" stroke="#45617b" stroke-width="2"/>
<text x="805.0" y="383.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">UC-03</text>
<text x="805.0" y="414.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">抽取、修改与确认作业要求</text>
<ellipse cx="805.0" cy="517.0" rx="265.0" ry="41.0" fill="#eaf2fb" stroke="#45617b" stroke-width="2"/>
<text x="805.0" y="501.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">UC-04</text>
<text x="805.0" y="532.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">拆解任务、分配负责人及设置依赖</text>
<ellipse cx="805.0" cy="635.0" rx="265.0" ry="41.0" fill="#eaf2fb" stroke="#45617b" stroke-width="2"/>
<text x="805.0" y="619.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">UC-06</text>
<text x="805.0" y="650.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">生成排程草案并解释冲突</text>
<ellipse cx="805.0" cy="753.0" rx="265.0" ry="41.0" fill="#e7f5f1" stroke="#45617b" stroke-width="2"/>
<text x="805.0" y="737.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">UC-08</text>
<text x="805.0" y="768.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">确认计划并生成正式版本</text>
<ellipse cx="805.0" cy="871.0" rx="265.0" ry="41.0" fill="#eaf2fb" stroke="#45617b" stroke-width="2"/>
<text x="805.0" y="855.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">UC-09</text>
<text x="805.0" y="886.5" text-anchor="middle" dominant-baseline="central" font-size="21" fill="#243b53" font-weight="400">时间或工时变化后提出计划调整</text>
<rect x="80" y="1040" width="1320" height="88" rx="12" fill="#fff4dd" stroke="#45617b" stroke-width="2"/>
<text x="740.0" y="1069.0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#243b53" font-weight="400">外部模型仅辅助理解与解释；确定性业务服务校验约束并执行排程。</text>
<text x="740.0" y="1099.0" text-anchor="middle" dominant-baseline="central" font-size="20" fill="#243b53" font-weight="400">模型未连接 UC-08：正式计划必须由有权用户确认，代理不能直接使其生效。</text>
